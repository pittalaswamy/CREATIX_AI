<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creatix AI - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-container">
    <div class="logo">✦ Creatix AI</div>
    <p class="subtitle">AI Content Creator Marketplace</p>

    <h2>Welcome Back!</h2>
    <p class="description">Sign in to connect, create and grow.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" minlength="6" required>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" id="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Sign In →</button>
    </form>

    <p class="signup">
      Don't have an account? <a href="#" id="signup">Create Account</a>
    </p>

    <a class="back" href="index.html">← Back to Home</a>

    <p id="message" style="text-align:center; margin-top:15px; font-size:13px; color:#e96c20;"></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
