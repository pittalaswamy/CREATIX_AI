<section id="brand-partners" style="padding:50px 7%;background:#10101a;color:white;font-family:Arial,sans-serif">
  <h2 style="text-align:center;font-size:32px">
    Brands on <span style="color:#b69aff">Creatix AI</span>
  </h2>

  <p style="text-align:center;color:#bbb">
    Discover creative opportunities with leading brands.
  </p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:30px">

    <div class="brand-card">
      <h2>NIKE</h2>
      <p>Sports & Lifestyle</p>
      <button onclick="selectBrand('Nike')">Connect</button>
    </div>

    <div class="brand-card">
      <h2>ADOBE</h2>
      <p>Creative Technology</p>
      <button onclick="selectBrand('Adobe')">Connect</button>
    </div>

    <div class="brand-card">
      <h2>SAMSUNG</h2>
      <p>Technology & Electronics</p>
      <button onclick="selectBrand('Samsung')">Connect</button>
    </div>

    <div class="brand-card">
      <h2>SPOTIFY</h2>
      <p>Music & Entertainment</p>
      <button onclick="selectBrand('Spotify')">Connect</button>
    </div>

    <div class="brand-card">
      <h2>COCA-COLA</h2>
      <p>Food & Beverages</p>
      <button onclick="selectBrand('Coca-Cola')">Connect</button>
    </div>

    <div class="brand-card">
      <h2>CANVA</h2>
      <p>Design & Creativity</p>
      <button onclick="selectBrand('Canva')">Connect</button>
    </div>

  </div>

  <p id="brand-message" style="text-align:center;margin-top:25px"></p>
</section>

<style>
.brand-card {
  background:#1b1b2a;
  border:1px solid #39334e;
  padding:25px 15px;
  border-radius:15px;
  text-align:center;
}
.brand-card h2 {
  color:#c5a9ff;
}
.brand-card p {
  color:#bbb;
}
.brand-card button {
  background:#b69aff;
  color:#171020;
  padding:11px 22px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.brand-card button:hover {
  background:#dfcaff;
}
</style>

<script>
function selectBrand(name) {
  document.getElementById("brand-message").textContent =
    name + " selected! Contact the brand through its official business channels to explore a partnership.";
}
</script>
