<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Creatix AI - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101a30, #243b61);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 12px 35px #00000040;
    }

    .logo {
      text-align: center;
      color: #ff812f;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #17243b;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: #17243b;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff812f;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0;
      font-size: 12px;
      gap: 8px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input {
      width: auto;
    }

    a {
      color: #e96c20;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ff812f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #e96c20;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">✦ Creatix AI</div>
    <p class="subtitle">AI Content Creator Marketplace</p>

    <h2>Welcome Back!</h2>
    <p class="description">
      Sign in to connect, create and grow.
    </p>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input type="type" id="email"
             placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password"
             placeholder="Enter your password"
             minlength="6" required>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a href="#" id="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Sign In →
      </button>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="#" id="signup">Create Account</a>
    </p>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

    <p id="message"
       style="text-align:center; margin-top:15px;
       font-size:13px; color:#e96c20;">
    </p>

  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Login page demo only. Backend authentication is not connected.";
      });

    document.getElementById("forgot")
      .addEventListener("click", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Password reset feature needs to be connected.";
      });

    document.getElementById("signup")
      .addEventListener("click", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Create Account page needs to be built.";
      });
  </script>

  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";

  // https://firebase.google.com/docs/web/setup#available-libraries

  const password=document.getElementById("password");

    projectId: "login-20ba4",
    storageBucket: "login-20ba4.firebasestorage.app",
    messagingSenderId: "472608911910",
    appId: "1:472608911910:web:c1110e45baec1b2489ece7",
    measurementId: "G-Z6MZ3WHYCB"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

</body>
</html>
